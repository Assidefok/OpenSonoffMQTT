version: 2

updates:
  - package-ecosystem: pip
    directory: /addon
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      addon-python:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /addon
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
